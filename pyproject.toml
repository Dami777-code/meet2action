[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meet2action"
version = "1.0.0"
description = "CLI tool to convert meeting notes into actionable markdown checklists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["cli", "meetings", "productivity", "action-items"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["typer>=0.12,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["pytest>=8,<9", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Dami777-code/meet2action"
Repository = "https://github.com/Dami777-code/meet2action"
Issues = "https://github.com/Dami777-code/meet2action/issues"

[project.scripts]
meet2action = "meet2action.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
