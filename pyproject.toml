[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meet2action"
version = "0.1.0"
description = "CLI tool to convert meeting notes into actionable markdown checklists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
meet2action = "meet2action.cli:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
